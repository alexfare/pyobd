name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements/requirements-win32.txt -r requirements/requirements-build.txt
      - name: Build application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name pyOBD --icon pyobd.ico
          --add-data "pyobd.ico:." --add-data "COPYING:."
          pyobd.py
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\pyobd.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: pyOBD-Windows-x64
          path: installer-dist/*.exe
          if-no-files-found: error

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: Apple-Silicon
          - runner: macos-15-intel
            architecture: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements/requirements-macos.txt -r requirements/requirements-build.txt
      - name: Build application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name pyOBD --icon pyobd.ico
          --osx-bundle-identifier com.farebrothers.pyobd
          --add-data "pyobd.ico:." --add-data "COPYING:."
          pyobd.py
      - name: Create disk image
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          mkdir dmg-root
          cp -R dist/pyOBD.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "pyOBD" -srcfolder dmg-root -ov -format UDZO "pyOBD-${version}-macOS-${{ matrix.architecture }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: pyOBD-macOS-${{ matrix.architecture }}
          path: pyOBD-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "$GITHUB_REF_NAME"
