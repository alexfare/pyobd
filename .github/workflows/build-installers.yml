name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements/requirements-win32.txt -r requirements/requirements-build.txt
      - name: Build application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name pyOBD --icon pyobd.ico
          --add-data "pyobd.ico:." --add-data "COPYING:."
          pyobd.py
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\pyobd.iss"
      - uses: actions/upload-artifact@v7
        with:
          name: pyOBD-Windows-x64
          path: installer-dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify signing configuration
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Import Developer ID certificate
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/pyobd-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: python -m pip install -r requirements/requirements-macos.txt -r requirements/requirements-build.txt
      - name: Build application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name pyOBD --icon pyobd.ico \
            --osx-bundle-identifier com.farebrothers.pyobd \
            --codesign-identity "$MACOS_SIGNING_IDENTITY" \
            --add-data "pyobd.ico:." --add-data "COPYING:." \
            pyobd.py
          codesign --verify --deep --strict --verbose=2 dist/pyOBD.app
      - name: Create and notarize disk image
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          dmg_path="pyOBD-${version}-macOS-Apple-Silicon.dmg"
          mkdir dmg-root
          cp -R dist/pyOBD.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "pyOBD" -srcfolder dmg-root -ov -format UDZO "$dmg_path"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
      - uses: actions/upload-artifact@v7
        with:
          name: pyOBD-macOS-Apple-Silicon
          path: pyOBD-*.dmg
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$MACOS_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv python3-wxgtk4.0
      - name: Install build dependencies
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv-build
          .venv-build/bin/python -m pip install -r requirements/requirements-ubuntu.txt -r requirements/requirements-build.txt
      - name: Build application
        run: >-
          .venv-build/bin/pyinstaller --noconfirm --clean --windowed --onedir
          --name pyOBD --icon pyobd.ico
          --add-data "pyobd.ico:." --add-data "COPYING:."
          pyobd.py
      - name: Build installer
        run: |
          version=$(.venv-build/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          bash packaging/linux/build-deb.sh "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: pyOBD-Linux-amd64
          path: installer-dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "$GITHUB_REF_NAME"
