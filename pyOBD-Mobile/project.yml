name: PyOBDMobile
options:
  bundleIdPrefix: com.farebrothers
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  PyOBDMobile:
    type: application
    platform: iOS
    productName: pyOBD Mobile
    sources:
      - path: PyOBDMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farebros.swiftOBD
        PRODUCT_NAME: pyOBD Mobile
        PRODUCT_MODULE_NAME: PyOBDMobile
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GC6DD3L4UQ
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PyOBDMobile/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PyOBDMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PyOBDMobileTests
    dependencies:
      - target: PyOBDMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PyOBDMobile:
    build:
      targets:
        PyOBDMobile: all
    run:
      config: Debug
    test:
      targets:
        - PyOBDMobileTests
