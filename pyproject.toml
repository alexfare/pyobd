[project]
dependencies = [
    "PySide6>=6.6,<7",
    "Pint>=0.20.1",
    "pyserial>=3.5,<4",
]

name = "pyobd2"
version = "3.0.0"
description = "A modern cross-platform OBD-II diagnostic application"
authors = [{ "name" = "Jure Poljsak" }, { "name" = "Charles Donour Sizemore" }, { "name" = "FareBrothers, LLC" }]
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.8"

[project.gui-scripts]
pyobd = "pyobd_app.app:main"

[tool.setuptools.package-data]
pyobd_app = ["ui/*.qml"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
